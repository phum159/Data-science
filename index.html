<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติวสอบ Final · Data Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FB; --card:#FFFFFF; --sunk:#F1F2F9; --ink:#1B1F3B; --muted:#6A6F8E; --line:#E3E5F0;
  --p:#5B4BDB; --p2:#8B5CF6; --p-soft:#ECE9FF; --t:#0E9384; --t-soft:#DDF5F1;
  --ok:#139A55; --ok-bg:#E6F7EE; --bad:#E0464C; --bad-bg:#FDECEC; --hl:rgba(255,206,51,.45);
  --sh:0 1px 2px rgba(27,31,59,.05),0 6px 20px rgba(27,31,59,.06);
  --sh-lg:0 12px 40px rgba(76,60,200,.28);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --card:#171A2E; --sunk:#1F2339; --ink:#E9EAF6; --muted:#9A9EBE; --line:#2A2E48;
  --p:#8B7CFF; --p2:#B794FF; --p-soft:rgba(139,124,255,.16); --t:#3DD6C3; --t-soft:rgba(61,214,195,.14);
  --ok:#3DD68C; --ok-bg:rgba(61,214,140,.13); --bad:#FF6B70; --bad-bg:rgba(255,107,112,.13); --hl:rgba(255,206,51,.28);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --sh-lg:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --card:#171A2E; --sunk:#1F2339; --ink:#E9EAF6; --muted:#9A9EBE; --line:#2A2E48;
  --p:#8B7CFF; --p2:#B794FF; --p-soft:rgba(139,124,255,.16); --t:#3DD6C3; --t-soft:rgba(61,214,195,.14);
  --ok:#3DD68C; --ok-bg:rgba(61,214,140,.13); --bad:#FF6B70; --bad-bg:rgba(255,107,112,.13); --hl:rgba(255,206,51,.28);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --sh-lg:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Leelawadee UI","Thonburi","Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big,.tab,.btn{font-family:"Anuphan","IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif}
a{color:var(--p);font-weight:600;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* hero */
.hero{margin:16px 0 0;border-radius:24px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,#A78BFA 0%,rgba(167,139,250,0) 55%),linear-gradient(135deg,#4338CA 0%,#6D28D9 100%);box-shadow:var(--sh-lg)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero-in{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.hero h1{font-size:clamp(1.55rem,6.2vw,2.2rem);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.hero p{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:.88rem}
.hero .ttl{flex:1;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pills span{font-size:.75rem;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.ring{flex:0 0 auto;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:rgba(255,255,255,.18)} .ring .fgc{stroke:#fff;transition:stroke-dashoffset .6s ease}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .rt b{font-family:"Anuphan",sans-serif;font-size:1.35rem}
.ring .rt small{font-size:.66rem;opacity:.8}
.hero-stats{display:flex;gap:16px;margin-top:12px;font-size:.8rem;color:rgba(255,255,255,.85)}
.hero-stats b{color:#fff;font-size:1rem;font-family:"Anuphan",sans-serif;margin-right:3px}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);margin-top:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
nav.tabs .row{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:780px;margin:0 auto;scrollbar-width:none}
nav.tabs .row::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;font-weight:600;padding:7px 14px;border-radius:14px;cursor:pointer;line-height:1.25;text-align:left;transition:transform .15s,box-shadow .15s}
.tab small{display:block;color:var(--muted);font-size:.7rem;font-weight:500;font-family:"IBM Plex Sans Thai",sans-serif}
.tab.x{border-color:color-mix(in srgb,var(--p) 35%,var(--line))}
.tab.x::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p2);margin-right:6px;vertical-align:middle}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--p),var(--p2));border-color:transparent;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 40%,transparent)}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.tab[aria-selected="true"]::before{background:#fff}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--p);outline-offset:2px}

main{padding:24px 0 72px}
h2{font-size:1.6rem;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}

/* summary */
details.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:24px;box-shadow:var(--sh);overflow:hidden}
details.sum>summary{cursor:pointer;padding:15px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:"Anuphan",sans-serif;font-size:1.05rem}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.sum[open]>summary::after{transform:rotate(-135deg)}
details.sum[open]>summary{border-bottom:1px solid var(--line)}
.sumbody{padding:6px 18px 18px}
.sumbody h4{margin:20px 0 6px;font-size:1rem;font-family:"Anuphan",sans-serif;color:var(--p)}
.sumbody p{margin:6px 0}
.sumbody ol{margin:6px 0;padding-left:22px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .08em;border-radius:2px}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{background:var(--sunk);font-weight:600}
td+td,th+th{border-left:1px solid var(--line)}
.formula{background:var(--p-soft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.92rem;line-height:1.85;font-variant-numeric:tabular-nums}
.note{background:var(--sunk);border-left:3px solid var(--p2);border-radius:8px;padding:9px 12px;font-size:.86rem}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.84rem;padding:5px 12px;border-radius:999px;cursor:pointer;transition:background .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.reset{margin-left:auto;color:var(--muted);background:transparent;border-style:dashed}
.score{font-size:.88rem;color:var(--muted);margin:0 0 14px}

/* question */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qn{flex:0 0 auto;min-width:32px;height:32px;border-radius:10px;background:var(--p-soft);color:var(--p);display:grid;place-content:center;font-weight:700;font-size:.85rem;font-family:"Anuphan",sans-serif}
.qt{font-weight:600;flex:1;padding-top:3px}
.badge{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-left:auto;align-self:flex-start;margin-top:5px}
.badge.cw{background:#FFF1C2;color:#8A5A00}
.badge.ex{background:var(--p-soft);color:var(--p)}
:root[data-theme="dark"] .badge.cw{background:rgba(255,206,51,.16);color:#FFD66B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.cw{background:rgba(255,206,51,.16);color:#FFD66B}}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;padding:9px 12px;border-radius:14px;cursor:pointer;line-height:1.5;transition:border-color .15s,background .15s,transform .1s}
.opt b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-content:center;background:var(--sunk);color:var(--muted);font-weight:700;font-size:.8rem;font-family:"Anuphan",sans-serif;transition:background .15s,color .15s}
.opt:hover:not([disabled]){border-color:var(--p);background:color-mix(in srgb,var(--p-soft) 50%,var(--card))}
.opt:hover:not([disabled]) b{background:var(--p);color:#fff}
.opt:active:not([disabled]){transform:scale(.99)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.6}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong b{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:.9rem;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.exp strong.ok{color:var(--ok)} .exp strong.bad{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:40px 0;background:var(--card);border-radius:18px;border:1px dashed var(--line)}

/* calc / written */
.calc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.calc h3{margin:0 0 6px;font-size:1.12rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc h3 .badge{margin-left:0;margin-top:0}
.steps{margin:10px 0 0;padding:12px 14px 12px 34px;background:var(--sunk);border-radius:12px}
.steps li{margin:4px 0;font-variant-numeric:tabular-nums}
.ex-q{font-weight:500;margin:10px 0 0}
.practice{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.practice p{margin:4px 0}
.reveal{border:1.5px solid var(--line);color:var(--ink);background:var(--card);font:inherit;font-size:.84rem;font-weight:600;padding:6px 12px;border-radius:10px;cursor:pointer}
.reveal:hover{border-color:var(--p);color:var(--p)}
.reveal[data-chk]{background:var(--t);border-color:var(--t);color:#fff}
.ans{font-weight:700;margin-top:6px;color:var(--t)}
.flds{display:grid;gap:10px;margin-top:14px}
.fld{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;align-items:center;font-size:.92rem}
.fld input,.fld select{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk);color:var(--ink);min-width:0;width:100%;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--p-soft)}
.fm{grid-column:2;font-size:.84rem;font-weight:700}
.fm.ok{color:var(--ok)} .fm.bad{color:var(--bad)}
#calcref .calc{border:none;box-shadow:none;padding:14px 0;border-bottom:1px solid var(--line);border-radius:0;margin:0}

/* mock / buttons */
.mockbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.mockbar.custom{align-items:center;margin-top:-8px}
.mockbar.custom label{font-size:.9rem;color:var(--muted);font-weight:600}
.mockbar.custom input{font:inherit;font-size:1rem;width:110px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk);color:var(--ink)}
.mockbar.custom input:focus{outline:none;border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--p-soft)}
.btn{border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 35%,transparent);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:var(--sh);display:flex;gap:16px;align-items:center}
.result .big{font-size:2.2rem;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.result .rb{flex:1}
.result .bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex;margin-top:8px}
.result .bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}

/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lc{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);color:var(--ink);font-weight:400;transition:transform .15s,border-color .15s}
.lc:hover{transform:translateY(-2px);border-color:var(--p)}
.lc .k{font-size:.75rem;color:var(--p);font-weight:700}
.lc h3{margin:2px 0 4px;font-size:1.05rem}
.lc p{margin:0;font-size:.8rem;color:var(--muted)}
.lc .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;margin-top:12px}
.lc .bar i{display:block;height:100%}
.kw{display:grid;gap:10px}
.kw div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
@media (prefers-reduced-motion:no-preference){
  .exp,.steps{animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="wrap"><div class="hero"><div class="hero-in">
  <div class="ttl"><h1>ติวสอบ Final<br>Data Science</h1><p>เนื้อหาหลัง hypothesis test · Lec 8–13</p>
  <div class="pills"><span>ปรนัย 95 ข้อ</span><span>วิธีทำ 3 ข้อ</span><span>3 ชั่วโมง</span><span>ปิดตำรา + เครื่องคิดเลข</span></div></div>
  <div class="ring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="42" fill="none" stroke-width="9"/><circle class="fgc" id="rfg" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"/></svg><div class="rt"><b id="rpct">0%</b><small>ทำแล้ว</small></div></div>
</div><div class="hero-stats" id="gtxt"></div></div></header>
<nav class="tabs" aria-label="หัวข้อ"><div class="row" id="tabs" role="tablist"></div></nav>
<main><div class="wrap" id="view"></div></main>
<script>
const TOPICS = [];

TOPICS.push({
  id: "l8", lec: "Lec 8", cw: "Classwork 9", title: "Data Engineering",
  summary: `
<p>วิศวกรรมข้อมูล = <mark>ออกแบบและจัดการโครงสร้างพื้นฐาน</mark> สำหรับเก็บและประมวลผลข้อมูล ให้พร้อมป้อนเข้า ML</p>
<h4>แหล่งข้อมูล 3 แบบ</h4>
<p>ข้อมูลจากผู้ใช้ (ผิดพลาดบ่อย ต้องทำความสะอาดมาก) · ข้อมูลที่ระบบสร้าง เช่น log (สม่ำเสมอแต่ปริมาณมาก) · ข้อมูลบุคคลที่สาม (หลากหลาย ต้องระวังความเป็นส่วนตัว)</p>
<h4>รูปแบบไฟล์</h4>
<table>
<tr><th></th><th>JSON</th><th>CSV</th><th>Parquet</th></tr>
<tr><td>ชนิด</td><td>Text</td><td>Text</td><td>Binary</td></tr>
<tr><td>เก็บแบบ</td><td>key-value</td><td>Row-major</td><td>Column-major</td></tr>
<tr><td>เด่น</td><td>อ่านง่าย แลกเปลี่ยนข้อมูล</td><td>ง่าย เข้ากับ DB หลายชนิด</td><td>อ่านเฉพาะบางคอลัมน์เร็ว ประหยัดพื้นที่</td></tr>
</table>
<p>ข้อจำกัด JSON: <mark>ใช้พื้นที่มาก</mark> (เป็น text) และเปลี่ยนโครงสร้างภายหลังยาก · ตัวอย่างในสไลด์: CSV 14 MB → Parquet 6 MB</p>
<p><b>Row-major</b> อ่านทั้งแถวเร็ว · <b>Column-major</b> อ่านทั้งคอลัมน์เร็ว (เหมาะงานวิเคราะห์)</p>
<h4>Data Model</h4>
<table>
<tr><th>โมเดล</th><th>เหมาะกับ</th><th>ข้อจำกัด / ตัวอย่าง</th></tr>
<tr><td>Relational (Codd, 1970)</td><td>ข้อมูลมีโครงสร้าง ต้องการความสอดคล้อง</td><td><mark>Join หลายตารางทำให้ช้า</mark>, schema ตายตัว · MySQL, PostgreSQL</td></tr>
<tr><td>Document (NoSQL)</td><td>ข้อมูลยืดหยุ่น เปลี่ยนบ่อย</td><td>เก็บ JSON/XML/BSON · MongoDB · collection≈table, document≈row</td></tr>
<tr><td>Graph (NoSQL)</td><td>ข้อมูลที่ความสัมพันธ์สำคัญ</td><td>node + edge · <mark>Neo4j</mark></td></tr>
</table>
<p>SQL เป็นภาษาแบบ <b>declarative</b> (บอกแค่ผลลัพธ์ที่ต้องการ) ระบบใช้ Query Optimizer หาวิธีดึงเอง</p>
<h4>ที่เก็บข้อมูล</h4>
<table>
<tr><th>Data Warehouse</th><th>Data Lake</th><th>Data Lakehouse</th></tr>
<tr><td>ข้อมูลมีโครงสร้าง ประมวลผลแล้ว พร้อมวิเคราะห์</td><td>ข้อมูลดิบทุกประเภท ไม่ต้องกำหนดโครงสร้าง</td><td>ผสมข้อดีของทั้งสอง (Databricks, Snowflake)</td></tr>
</table>
<p><b>ETL</b> = Extract → Transform → Load · <b>ELT</b> = โหลดข้อมูลดิบก่อน แล้วค่อยแปลง</p>
<h4>OLTP vs OLAP</h4>
<p><b>OLTP</b> ธุรกรรมของผู้ใช้ ต้องเร็ว (จองตั๋ว, เรียกรถ) ใช้ ACID, row-major · <b>OLAP</b> query เชิงวิเคราะห์ aggregate หลายแถว (ราคาเฉลี่ยค่ารถเดือน ก.ย.)</p>
<p><b>ACID</b>: Atomicity (สำเร็จทั้งหมดหรือยกเลิกทั้งหมด) · Consistency (ตามกฎที่วางไว้) · Isolation (ธุรกรรมพร้อมกันแยกกัน) · Durability (ยืนยันแล้วคงอยู่แม้ระบบล่ม) · ระบบที่ไม่เป็น ACID เรียก <b>BASE</b> (Basically Available, Soft state, Eventual consistency)</p>
<h4>Dataflow 3 โหมด</h4>
<p>1) ผ่านฐานข้อมูล (ช้า ไม่เหมาะ real-time) · 2) ผ่าน Request: REST (API สาธารณะ), RPC (ภายในองค์กร) — แบบ synchronous · 3) <mark>Real-time transport</mark> ผ่าน broker ในหน่วยความจำ: Pub/Sub (Kafka, Kinesis) และ Message Queue (RabbitMQ, RocketMQ) → ลดความซับซ้อนการสื่อสารระหว่างบริการ</p>

TOPICS.push({
  id: "l9", lec: "Lec 9", cw: "Classwork 10", title: "Training Data",
  summary: `
<h4>ทำไมต้องเตรียม Training Data</h4>
<p>ผลลัพธ์โมเดลขึ้นกับคุณภาพข้อมูล · ลดจำนวน epoch ประหยัดค่าคำนวณ · <mark>ป้องกัน Overfitting และ Underfitting</mark></p>
<p>Overfitting = จำข้อมูลฝึกละเอียดเกินไป ใช้กับข้อมูลใหม่ไม่ได้ · Underfitting = จับ pattern ไม่ได้</p>
<h4>Sampling</h4>
<p>ทำเพื่อ: ลดขนาดข้อมูล/ภาระคำนวณ, เข้าถึงข้อมูลทั้งหมดไม่ได้, ทดสอบแนวคิดเร็ว</p>
<table>
<tr><th>Non-probability (ไม่ใช้ความน่าจะเป็น, มีอคติ)</th><th>Random (ใช้หลักสถิติ)</th></tr>
<tr><td><b>Convenience</b> เลือกที่เข้าถึงง่าย<br><b>Snowball</b> ขยายต่อเป็นทอด (follow ของ follow)<br><b>Expert</b> เลือกผู้เชี่ยวชาญ<br><mark><b>Quota</b></mark> กำหนดจำนวนแต่ละกลุ่มตามสัดส่วน</td>
<td><b>Simple Random</b> ทุกตัวมีโอกาสเท่ากัน<br><b>Stratified</b> แบ่งชั้นแล้วสุ่มแต่ละชั้น — แม่นขึ้น แต่<mark>ซับซ้อน ใช้เวลา</mark> ต้องรู้ลักษณะประชากร<br><b>Weighted</b> ให้น้ำหนักแต่ละตัว (แดง 25% น้ำเงิน 75% → ให้แดงหนักกว่า 3 เท่า)<br><b>Reservoir</b> สุ่มจาก stream</td></tr>
</table>
<p class="note">ระวัง: Systematic และ Cluster sampling เป็นแบบ probability</p>
<h4>Reservoir Sampling</h4>
<p>ใช้เมื่อ <mark>ข้อมูลไหลเข้ามาต่อเนื่อง ใหญ่เกินหน่วยความจำ</mark> ไม่รู้จำนวนทั้งหมดล่วงหน้า</p>
<ol><li>เติม k ตัวแรกลง reservoir</li><li>ตัวที่ n: สุ่ม I จาก [1, n] ถ้า I ≤ k แทนที่ตำแหน่ง I ไม่งั้นข้าม</li><li>หยุดเมื่อไรก็ได้ ทุกตัวมีโอกาสอยู่ใน reservoir = k/N</li></ol>
<p>ผลลัพธ์ <mark>ไม่แน่นอน</mark> ขึ้นกับการสุ่มแต่ละรอบ</p>
<h4>Labeling</h4>
<p>สำคัญกับ Supervised Learning — label ผิด โมเดลเรียนผิด กระทบ accuracy/precision/recall/F1</p>
<p><b>Hand label</b>: แพง ช้า ปัญหาความเป็นส่วนตัว · <b>Label multiplicity</b>: ผู้ติดฉลากหลายคนให้ label ขัดแย้ง → แก้ด้วย <b>Data lineage</b> (ติดตามที่มาข้อมูล) · <b>Natural label</b>: ได้จากระบบเอง เช่น เวลาเดินทางจริงของ Google Maps, การคลิกโฆษณา</p>
<h4>เมื่อขาด Label: 4 เทคนิค</h4>
<table>
<tr><th>วิธี</th><th>หลักการ</th><th>ต้องมี ground truth?</th></tr>
<tr><td>Weak Supervision</td><td>ใช้ heuristic สร้าง label ผ่าน Labeling Function (Snorkel): <mark>Keyword heuristic</mark>, Regex, Database lookup, Model output</td><td>ไม่ต้อง (แนะนำมีเล็กน้อย)</td></tr>
<tr><td>Semi-Supervision</td><td>สมมติฐานเชิงโครงสร้าง: <b>Self-training</b>, ความคล้ายคลึง (clustering/KNN), Perturbation (เติม noise)</td><td>ต้อง (เล็กน้อย)</td></tr>
<tr><td>Transfer Learning</td><td>เอาโมเดลต้นน้ำมาใช้กับงานใหม่: zero-shot, fine-tuning → <mark>ลดเวลา ลดต้นทุน</mark></td><td>zero-shot ไม่ต้อง / fine-tune ต้องเล็กน้อย</td></tr>
<tr><td>Active Learning</td><td><mark>โมเดลเลือกตัวอย่างที่ไม่แน่นอนสูง</mark> (ใกล้ decision boundary) ให้มนุษย์ label · อีกชื่อ Query learning</td><td>ต้อง</td></tr>
</table>`,

  summary: `
<p>คลาสมีจำนวนไม่เท่ากัน พบใน rare events: fraud 1%, <mark>มะเร็ง 2%</mark> → โมเดล bias ไปทาง majority</p>
<h4>ปัญหา 3 ข้อ</h4>
<p>1) โมเดลเรียน minority ไม่พอ (คล้าย few-shot) · 2) ทาย "ปกติ" ตลอด → accuracy สูงแต่ recall = 0 · 3) <b>Asymmetric cost</b>: FN (ป่วยแต่ทายว่าไม่ป่วย) ร้ายแรงกว่า FP</p>
<p>ผลกระทบมากขึ้นกับ: งานซับซ้อน, multi-class มากกว่า binary · <mark>Deep NN รับมือได้ดีกว่า shallow model</mark> (เรียนรู้ feature representation ซับซ้อนได้)</p>
<h4>Percentile สูง (P95)</h4>
<p>การกระจายเบ้ → median ไม่สะท้อน minority จึงดู <mark>P95</mark> · ข้อเสีย: <mark>ไวต่อ outlier</mark>, ไม่สะท้อนค่าทั่วไป, ไม่เสถียรเมื่อ sample น้อย, ตีความยาก, อาจทำให้ FP สูง → ใช้คู่กับ median, IQR</p>
<h4>Confusion Matrix</h4>
<table>
<tr><th></th><th>จริง +</th><th>จริง −</th></tr>
<tr><th>ทาย +</th><td>TP</td><td>FP (Type I, false alarm)</td></tr>
<tr><th>ทาย −</th><td>FN (Type II, miss)</td><td>TN</td></tr>
</table>
<div class="formula">Accuracy = (TP+TN) / ทั้งหมด<br>Precision = TP / (TP+FP)<br>Recall = Sensitivity = TPR = TP / (TP+FN)<br>Specificity = TN / (TN+FP)<br>FPR = FP / (FP+TN) = 1 − Specificity<br>F1 = 2·P·R / (P+R) &nbsp;(harmonic mean)<br>Balanced Accuracy = (Sensitivity + Specificity) / 2</div>
<p><b>Accuracy ไม่เหมาะ</b>กับข้อมูลไม่สมดุล · อยากลด FN → เน้น <mark>Recall</mark> (ตรวจมะเร็ง) · Precision สูง Recall ต่ำ = เจอน้อยแต่ที่เจอถูก</p>
<h4>Threshold, ROC, PR</h4>
<p>ลด threshold → TPR ↑ และ FPR ↑ · เพิ่ม threshold → ทั้งคู่ ↓ · <b>ROC</b> = กราฟ <mark>TPR vs FPR</mark> ยิ่ง AUC มากยิ่งดี · imbalance มาก ROC-AUC อาจหลอก → ใช้ <mark>PR-AUC</mark></p>
<h4>Resampling (data-level) — เหมาะกับข้อมูลไม่ซับซ้อน</h4>
<table>
<tr><th>Oversampling (เพิ่ม minority)</th><th>Undersampling (ลด majority)</th></tr>
<tr><td>Random/duplicate: ง่าย แต่<mark>เสี่ยง overfitting</mark><br><b>SMOTE</b>: สร้างจุดสังเคราะห์ระหว่างจุด minority กับเพื่อนบ้าน<br>x_new = x + λ·(x_nb − x), λ∈[0,1]</td>
<td>เสี่ยง<mark>สูญเสียข้อมูลสำคัญของ majority</mark><br><b>NearMiss-1</b>: <mark>เก็บ majority ที่ใกล้ minority</mark> (ระยะเฉลี่ยน้อยสุด)<br><b>OSS</b> (1-NN): ลบ majority ที่ใกล้ minority/ขอบเขต</td></tr>
</table>
<p><b>Two-phase learning</b>: เฟส 1 undersample แล้ว train → เฟส 2 oversample (เช่น SMOTE) แล้ว fine-tune โมเดลเดิม</p>
<p><b>Cost-sensitive learning</b> (algorithm-level): ปรับ loss ให้ error ที่แพงมีน้ำหนักมากกว่า (weighted loss)</p>`,

<script>

const L="ABCDE";
function seeded(seed){let h=7;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;return()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296}}
function ordFor(key,q){const n=q.o.map((_,i)=>i);if(q.s!=="ex"||q.ns)return n;const r=seeded(key);for(let i=n.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[n[i],n[j]]=[n[j],n[i]]}return n}

  const a=document.querySelector('.tab[aria-selected="true"]');if(a)a.scrollIntoView({block:"nearest",inline:"center"});
}
function go(id){cur=id;history.replaceState(null,"","#"+id);renderTabs();render();window.scrollTo(0,0)}

function globalMeter(){
  let tot=0,ok=0,bad=0;
  TOPICS.forEach(t=>{tot+=t.quiz.length;const s=store[t.id]||{};t.quiz.forEach((q,i)=>{if(s[i]!==undefined){s[i]===q.a?ok++:bad++}})});
  const done=ok+bad,pct=Math.round(done/tot*100);
  document.getElementById("rfg").style.strokeDashoffset=263.9*(1-done/tot);

}

function qCard(q,num,picked,onPick,key,order){
  const ord=order||q.o.map((_,i)=>i);

    let cls="";if(done){if(oi===q.a)cls="right";else if(oi===picked)cls="wrong"}
    return `<button class="opt ${cls}" data-k="${key}" data-o="${oi}" ${done?"disabled":""}><b>${L[pos]}</b><span>${esc(q.o[oi])}</span></button>`;

  return `<div class="q"><div class="qh"><span class="qn">${num}</span><span class="qt">${esc(q.q)}</span><span class="badge ${q.s}">${q.s==="cw"?q.cwname:"ฝึกเพิ่ม"}</span></div><div class="opts">${opts}</div>${exp}</div>`;
}

/* ===== สอบข้อเขียน: สุ่มโจทย์ ===== */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pk=a=>a[Math.floor(Math.random()*a.length)];
const r2=x=>Math.round(x*100)/100;
const fm=x=>{const v=r2(x);return (Object.is(v,-0)?0:v).toString().replace("-","−")};
const sum=a=>a.reduce((s,x)=>s+x,0);
function distinctSorted(n,lo,hi){const s=new Set();while(s.size<n)s.add(ri(lo,hi));return [...s].sort((a,b)=>a-b)}

const GEN={
  z(){
    const m=pk([50,60,65,70,75,80]),s=pk([4,6,8,10,12]);
    const kOut=pk([3.5,4,-3.5,4.5,-4]),kIn=pk([1.5,2,-2.5,-1,2.5,-2]);
    let A={x:m+kOut*s,z:kOut,out:true},B={x:m+kIn*s,z:kIn,out:false};
    if(Math.random()<.5)[A,B]=[B,A];
    const ans=A.out?0:1;
    return {t:"Z-score และ outlier",
      q:`คะแนนสอบมีค่าเฉลี่ย μ = ${m} และส่วนเบี่ยงเบนมาตรฐาน σ = ${s}<br>ก) หา Z-score ของ x₁ = ${A.x}<br>ข) หา Z-score ของ x₂ = ${B.x}<br>ค) ค่าใดเป็น outlier (เกณฑ์ |Z| &gt; 3)`,
      f:[{l:"ก) Z(x₁)",a:A.z},{l:"ข) Z(x₂)",a:B.z},{l:"ค) outlier",c:["x₁","x₂","ทั้งคู่","ไม่มี"],a:ans}],
      s:[`Z(x₁) = (${A.x} − ${m}) / ${s} = ${fm(A.z)}`,`Z(x₂) = (${B.x} − ${m}) / ${s} = ${fm(B.z)}`,`|${fm(A.out?A.z:B.z)}| &gt; 3 → ${A.out?"x₁":"x₂"} เป็น outlier ส่วนอีกค่า |Z| ≤ 3 ไม่เป็น`]};
  },
  std(){
    const n=5,d=distinctSorted(n,10,60),mu=sum(d)/n,sd=Math.sqrt(sum(d.map(x=>(x-mu)**2))/n);
    const x=pk([d[0],d[1],d[3],d[4]]),z=(x-mu)/sd;
    const shown=d.slice().sort(()=>Math.random()-.5);
    return {t:"Standardization",
      q:`ข้อมูล [${shown.join(", ")}]<br>ก) หาค่าเฉลี่ย μ<br>ข) หา σ (หารด้วย n ตามตัวอย่างสไลด์)<br>ค) Standardize ค่า ${x}`,
      f:[{l:"ก) μ",a:mu},{l:"ข) σ",a:sd},{l:`ค) z(${x})`,a:z}],
      s:[`μ = ${sum(d)} / ${n} = ${fm(mu)}`,`ผลต่างกำลังสอง: ${d.map(v=>fm((v-mu)**2)).join(", ")} → รวม ${fm(sum(d.map(v=>(v-mu)**2)))}`,`σ = √(${fm(sum(d.map(v=>(v-mu)**2)))} / ${n}) = ${fm(sd)}`,`z = (${x} − ${fm(mu)}) / ${fm(sd)} = ${fm(z)}`]};
  },
  norm(){
    const d=distinctSorted(5,-20,40);if(d[0]>=0)d[0]=-ri(4,15);
    d.sort((a,b)=>a-b);
    const mn=d[0],mx=d[4],rg=mx-mn,mean=sum(d)/5,ma=Math.max(...d.map(Math.abs));
    const a=d[2],b=d[3],c=d[1];
    return {t:"Normalization 3 แบบ",
      q:`ข้อมูล [${d.join(", ")}]<br>ก) Min-Max Normalization ของ ${a}<br>ข) Mean Normalization ของ ${b}<br>ค) Maximum Absolute Scaling ของ ${c}`,
      f:[{l:`ก) Min-Max(${a})`,a:(a-mn)/rg},{l:`ข) Mean(${b})`,a:(b-mean)/rg},{l:`ค) MaxAbs(${c})`,a:c/ma}],
      s:[`min = ${mn}, max = ${mx}, max − min = ${rg}`,`ก) (${a} − (${mn})) / ${rg} = ${fm((a-mn)/rg)}`,`mean = ${sum(d)} / 5 = ${fm(mean)}`,`ข) (${b} − ${fm(mean)}) / ${rg} = ${fm((b-mean)/rg)}`,`max|x| = ${ma}`,`ค) ${c} / ${ma} = ${fm(c/ma)}`]};
  },
  iqr(){
    let d,q1,q3,iq,up;
    do{d=distinctSorted(10,ri(1,10),ri(30,50));q1=d[2];q3=d[8];iq=q3-q1;up=q3+1.5*iq}while(d[9]>up);
    const out=Math.ceil(up)+ri(15,80);d=[...d.slice(0,10),out].sort((a,b)=>a-b);
    q1=d[2];q3=d[8];iq=q3-q1;up=q3+1.5*iq;const lo=q1-1.5*iq;
    return {t:"IQR และ Winsorization",
      q:`ข้อมูล (เรียงแล้ว, n = 11): [${d.join(", ")}]<br>ก) Q1 &nbsp; ข) Q3 &nbsp; ค) IQR<br>ง) ขีดจำกัดบน (d = 1.5)<br>จ) ทำ Winsorization แล้ว ${out} จะกลายเป็นเท่าไร`,
      f:[{l:"ก) Q1",a:q1},{l:"ข) Q3",a:q3},{l:"ค) IQR",a:iq},{l:"ง) ขีดบน",a:up},{l:`จ) ค่าใหม่ของ ${out}`,a:up}],
      s:[`ตำแหน่ง Q1 = (n+1)/4 = 3 → Q1 = ${q1}`,`ตำแหน่ง Q3 = 3(n+1)/4 = 9 → Q3 = ${q3}`,`IQR = ${q3} − ${q1} = ${iq}`,`ขีดบน = ${q3} + 1.5(${iq}) = ${fm(up)} · ขีดล่าง = ${q1} − ${fm(1.5*iq)} = ${fm(lo)}`,`${out} &gt; ${fm(up)} → แทนด้วย ${fm(up)}`]};
  },
  gauss(){
    const m=pk([40,50,60,70,100]),s=pk([5,8,10,12,15]);
    const hi=m+3*s+ri(5,40),lo=m-3*s-ri(3,15),mid=m+ri(-2,2)*s;
    return {t:"Winsorization แบบ Gaussian",
      q:`ข้อมูลมีค่าเฉลี่ย ${m} และ SD = ${s} ใช้ขอบเขต mean ± 3SD<br>ก) ขีดจำกัดบน &nbsp; ข) ขีดจำกัดล่าง<br>ค) ค่าใหม่ของ ${hi} &nbsp; ง) ค่าใหม่ของ ${lo} &nbsp; จ) ค่าใหม่ของ ${mid}`,
      f:[{l:"ก) ขีดบน",a:m+3*s},{l:"ข) ขีดล่าง",a:m-3*s},{l:`ค) ${hi} →`,a:m+3*s},{l:`ง) ${lo} →`,a:m-3*s},{l:`จ) ${mid} →`,a:mid}],
      s:[`ขีดบน = ${m} + 3(${s}) = ${m+3*s}`,`ขีดล่าง = ${m} − 3(${s}) = ${m-3*s}`,`${hi} เกินขีดบน → ${m+3*s}`,`${lo} ต่ำกว่าขีดล่าง → ${m-3*s}`,`${mid} อยู่ในช่วง → คงเดิม`]};
  },
  lnorm(){
    const v=pk([[3,4],[6,8],[5,12],[8,15],[1,2,2],[2,3,6],[4,4,7],[9,12]]);
    const l2=Math.sqrt(sum(v.map(x=>x*x))),l1=sum(v);
    return {t:"Normalize to Unit Length",
      q:`เวกเตอร์ X = (${v.join(", ")})<br>ก) L2 norm &nbsp; ข) องค์ประกอบแรกหลัง L2 normalize<br>ค) L1 norm &nbsp; ง) องค์ประกอบสุดท้ายหลัง L1 normalize`,
      f:[{l:"ก) ‖X‖₂",a:l2},{l:"ข) x₁ / ‖X‖₂",a:v[0]/l2},{l:"ค) ‖X‖₁",a:l1},{l:"ง) xₙ / ‖X‖₁",a:v[v.length-1]/l1}],
      s:[`L2 = √(${v.map(x=>x+"²").join(" + ")}) = √${sum(v.map(x=>x*x))} = ${fm(l2)}`,`L2 normalize = (${v.map(x=>fm(x/l2)).join(", ")})`,`L1 = ${v.join(" + ")} = ${l1}`,`L1 normalize = (${v.map(x=>fm(x/l1)).join(", ")})`]};
  },
  conf(){
    const tp=ri(20,90),fn=ri(5,40),fp=ri(5,40),tn=ri(100,600),N=tp+fn+fp+tn;
    const P=tp/(tp+fp),R=tp/(tp+fn),F=2*P*R/(P+R);
    return {t:"Confusion Matrix",
      q:`TP = ${tp}, FN = ${fn}, FP = ${fp}, TN = ${tn}<br>หา Accuracy, Precision, Recall และ F1 (ทศนิยม 2 ตำแหน่ง)`,
      f:[{l:"Accuracy",a:(tp+tn)/N},{l:"Precision",a:P},{l:"Recall",a:R},{l:"F1",a:F}],
      s:[`N = ${N} → Accuracy = (${tp} + ${tn}) / ${N} = ${fm((tp+tn)/N)}`,`Precision = ${tp} / (${tp} + ${fp}) = ${fm(P)}`,`Recall = ${tp} / (${tp} + ${fn}) = ${fm(R)}`,`F1 = 2(${fm(P)})(${fm(R)}) / (${fm(P)} + ${fm(R)}) = ${fm(F)}`]};
  },
  smote(){
    const A=[ri(0,6),ri(0,6)],B=[ri(2,10),ri(0,10)],l=pk([0.2,0.25,0.4,0.5,0.6,0.75]);
    const x=A[0]+l*(B[0]-A[0]),y=A[1]+l*(B[1]-A[1]);
    return {t:"SMOTE",
      q:`จุด minority A = (${A}) เพื่อนบ้านใกล้สุด B = (${B}) สุ่มได้ λ = ${l}<br>หาพิกัดจุดใหม่ (x, y)`,
      f:[{l:"x ใหม่",a:x},{l:"y ใหม่",a:y}],
      s:[`x = ${A[0]} + ${l}(${B[0]} − ${A[0]}) = ${fm(x)}`,`y = ${A[1]} + ${l}(${B[1]} − ${A[1]}) = ${fm(y)}`]};
  },
  ew(){
    const k=pk([3,4,5]),w=pk([5,8,10,12,15,20]),mn=pk([0,5,10,20]),mx=mn+k*w;let val=ri(mn+1,mx-1);while((val-mn)%w===0)val=ri(mn+1,mx-1);
    let bin=Math.floor((val-mn)/w)+1;if(bin>k)bin=k;
    const m=k*pk([3,4,5]);
    return {t:"Equal Width / Frequency",
      q:`ข้อมูลมีค่าต่ำสุด ${mn} สูงสุด ${mx} จำนวน ${m} ตัวอย่าง แบ่ง ${k} bin<br>ก) ความกว้าง bin แบบ Equal Width<br>ข) ค่า ${val} อยู่ bin ที่เท่าไร (Equal Width)<br>ค) แบบ Equal Frequency แต่ละ bin มีกี่ตัวอย่าง`,
      f:[{l:"ก) w",a:w},{l:"ข) bin ที่",a:bin},{l:"ค) f",a:m/k}],
      s:[`w = (${mx} − ${mn}) / ${k} = ${w}`,`ขอบ: ${Array.from({length:k},(_,i)=>`[${mn+i*w}, ${mn+(i+1)*w}]`).join(", ")}`,`${val} อยู่ bin ที่ ${bin}`,`f = ${m} / ${k} = ${m/k}`]};
  }
};
const GEN_TEACHER=["z","std","norm","iqr","gauss"],GEN_ALL=Object.keys(GEN);
const GEN_NAME={z:"Z-score",std:"Standardization",norm:"Normalization",iqr:"IQR",gauss:"Gaussian",lnorm:"L1/L2",conf:"Confusion",smote:"SMOTE",ew:"Binning"};
let wset=null,wmode="teacher";
function newSet(){
  const pool=wmode==="teacher"?GEN_TEACHER:wmode==="all"?GEN_ALL:[wmode];
  const keys=pool.length>=3?shuffle(pool).slice(0,3):[pool[0],pool[0],pool[0]];
  wset=keys.map(k=>({k,p:GEN[k](),u:{},chk:false,show:false}));
}
function okNum(u,a){const s=String(u).trim().replace("−","-").replace(",",".");if(s==="")return false;let v=Number(s);if(s.includes("/")){const[x,y]=s.split("/");v=Number(x)/Number(y)}if(!isFinite(v))return false;return Math.abs(v-a)<=Math.max(0.011,Math.abs(a)*0.005)}
function renderWrite(v){

  <div class="filters">${mc("teacher","เรื่องที่อาจารย์บอก")}${mc("all","ทุกเรื่อง")}${GEN_ALL.map(k=>mc(k,GEN_NAME[k])).join("")}</div>
  <div class="mockbar"><button class="btn" id="newset">สุ่มชุดใหม่</button></div>`;

      const u=it.u[j]??"";let mark="";
      if(it.chk){const ok=f.c?(+u===f.a&&u!==""):okNum(u,f.a);mark=`<span class="fm ${ok?"ok":"bad"}">${ok?"✓":"✗ "+(f.c?f.c[f.a]:fm(f.a))}</span>`}
      const inp=f.c?`<select data-i="${i}" data-j="${j}"><option value="">เลือก</option>${f.c.map((c,ci)=>`<option value="${ci}" ${String(u)===String(ci)?"selected":""}>${c}</option>`).join("")}</select>`

      return `<label class="fld"><span>${f.l}</span>${inp}${mark}</label>`}).join("");
    const nOk=it.chk?p.f.filter((f,j)=>f.c?(+it.u[j]===f.a&&it.u[j]!==""&&it.u[j]!==undefined):okNum(it.u[j]??"",f.a)).length:0;
    return `<section class="calc"><h3>ข้อ ${i+1} · ${p.t}${it.chk?` <span class="badge ${nOk===p.f.length?"cw":"ex"}">ถูก ${nOk}/${p.f.length}</span>`:""}</h3>
    <p class="ex-q">${p.q}</p><div class="flds">${fields}</div>
    <div class="mockbar" style="margin:10px 0 0"><button class="reveal" data-chk="${i}">ตรวจคำตอบ</button><button class="reveal" data-sh="${i}">${it.show?"ซ่อนวิธีทำ":"ดูวิธีทำ"}</button><button class="reveal" data-re="${i}">โจทย์ใหม่ข้อนี้</button></div>
    ${it.show?`<ol class="steps">${p.s.map(x=>`<li>${x}</li>`).join("")}</ol>`:""}</section>`}).join("");
  h+=`<details class="sum" style="margin-top:28px"><summary>สูตรและตัวอย่างทุกเรื่อง</summary><div class="sumbody" id="calcref"></div></details>`;
  v.innerHTML=h;
  renderCalcRef(v.querySelector("#calcref"));
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{wmode=b.dataset.m;newSet();render()});
  v.querySelector("#newset").onclick=()=>{newSet();render()};
  v.querySelectorAll("input[data-i],select[data-i]").forEach(el=>{el.oninput=el.onchange=()=>{wset[+el.dataset.i].u[+el.dataset.j]=el.value}});
  const keep=fn=>{const y=window.scrollY;fn();render();window.scrollTo(0,y)};
  v.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>keep(()=>{wset[+b.dataset.chk].chk=true}));
  v.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>keep(()=>{const it=wset[+b.dataset.sh];it.show=!it.show}));
  v.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>keep(()=>{const i=+b.dataset.re;const k=wset[i].k;wset[i]={k,p:GEN[k](),u:{},chk:false,show:false}}));
}

let mock=null;
const TOTAL_Q=TOPICS.reduce((s,t)=>s+t.quiz.length,0);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startMock(n){
  const pool=[];TOPICS.forEach(t=>t.quiz.forEach((q,i)=>pool.push({...q,cwname:t.lec,ref:t.lec})));
  const pick=shuffle(pool).slice(0,n);
  mock={n,qs:pick.map(q=>({q,order:q.ns?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i)),p:undefined})),done:false};
  render();
}
function renderMock(v){
  let h=`<h2>สอบข้อกา</h2><p class="sub">สุ่มข้อจากทุกบท และสลับตำแหน่งตัวเลือก ตอบแล้วเฉลยทันที</p><div class="mockbar">${[[20,"20 ข้อ"],[50,"50 ข้อ"],[95,"95 ข้อ (เท่าสอบจริง)"],[TOTAL_Q,`ทุกข้อ (${TOTAL_Q})`]].map(([n,l])=>`<button class="btn${mock&&mock.n===n?"":" ghost"}" data-n="${n}" aria-pressed="${!!(mock&&mock.n===n)}">${l}</button>`).join("")}</div>
  <form class="mockbar custom" id="mockc" novalidate><label for="mockn">กำหนดเอง</label><input id="mockn" type="number" inputmode="numeric" min="1" max="${TOTAL_Q}" placeholder="1–${TOTAL_Q}" value="${mock&&![20,50,95,TOTAL_Q].includes(mock.n)?mock.n:""}"><button class="btn" type="submit">สุ่ม</button></form>`;
  if(mock){
    const ans=mock.qs.filter(x=>x.p!==undefined),ok=ans.filter(x=>x.p===x.q.a).length;
    h+=`<div class="result"><div class="big">${ok}<span style="font-size:1.1rem">/${mock.qs.length}</span></div><div class="rb"><div>ตอบแล้ว ${ans.length} ข้อ${ans.length===mock.qs.length?` · ได้ ${Math.round(ok/mock.qs.length*100)}%`:""}</div><div class="bar"><i class="g" style="width:${ok/mock.qs.length*100}%"></i><i class="r" style="width:${(ans.length-ok)/mock.qs.length*100}%"></i></div></div></div>`;
    h+=mock.qs.map((x,i)=>qCard({...x.q,cwname:x.q.ref,s:"ex"},i+1,x.p,null,"m:"+i,x.order).replace('class="badge ex">ฝึกเพิ่ม','class="badge ex">'+esc(x.q.ref))).join("");
  }
  v.innerHTML=h;
  v.querySelectorAll(".btn[data-n]").forEach(b=>b.onclick=()=>startMock(+b.dataset.n));
  v.querySelector("#mockc").onsubmit=e=>{e.preventDefault();const n=Math.round(+v.querySelector("#mockn").value);if(n>=1)startMock(Math.min(n,TOTAL_Q))};
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.k.split(":")[1];mock.qs[i].p=+b.dataset.o;const y=window.scrollY;render();window.scrollTo(0,y)});
}

function render(){
  const v=document.getElementById("view");
  if(cur==="home")renderHome(v);
  else if(cur==="write")renderWrite(v);
  else if(cur==="mock")renderMock(v);
  else renderTopic(v,TOPICS.find(t=>t.id===cur));
  v.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)});
  globalMeter();
}
renderTabs();render();
</script>
</body>
</html>
